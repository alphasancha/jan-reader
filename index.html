<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>バーコードスキャン</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b192c 0%, #1e3a8a 100%);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-red: #ff3b30;
      --accent-red-glow: rgba(255, 59, 48, 0.8);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px 16px;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      text-align: center;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    h2 {
      margin: 0 0 6px 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .sub-text {
      font-size: 13px;
      color: var(--text-sub);
      margin: 0 0 20px 0;
    }

    /* スキャナーコンテナ */
    #scanner-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #reader {
      width: 100%;
      border: none !important;
    }

    #reader video {
      object-fit: cover;
    }

    /* html5-qrcodeのデフォルト枠を完全に非表示にする */
    #reader__scan_region {
      background: transparent !important;
    }
    #reader__dashboard {
      padding: 10px !important;
    }

    /* 上下の余計なバーコードをシャットアウトする強力な上下マスク */
    .scan-mask-top, .scan-mask-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: calc(50% - 15px); /* 中央のスリット部分（高さ30px）以外をすべて黒幕で覆う */
      background: rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 10;
    }
    .scan-mask-top { top: 0; }
    .scan-mask-bottom { bottom: 0; }

    /* 左右のガイドフレーム */
    .scan-mask-left, .scan-mask-right {
      position: absolute;
      top: calc(50% - 15px);
      width: 30px;
      height: 30px;
      pointer-events: none;
      z-index: 11;
      border-color: rgba(255, 255, 255, 0.6);
      border-style: solid;
    }
    .scan-mask-left {
      left: 20px;
      border-width: 2px 0 0 2px;
    }
    .scan-mask-right {
      right: 20px;
      border-width: 2px 2px 0 0;
    }

    /* 真ん中の極細赤線ガイド */
    .scan-laser {
      position: absolute;
      top: 50%;
      left: 10%;
      width: 80%;
      height: 2px;
      background-color: var(--accent-red);
      box-shadow: 0 0 8px var(--accent-red-glow), 0 0 16px var(--accent-red-glow);
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 12;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translateY(-50%) scaleX(0.95); }
      50% { opacity: 1; transform: translateY(-50%) scaleX(1.02); }
    }

    #status {
      margin: 20px 0 10px 0;
      font-size: 14px;
      color: #e2e8f0;
      font-weight: 500;
      min-height: 20px;
    }

    button {
      padding: 16px;
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff3b30 0%, #d70015 100%);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 4px 14px rgba(230, 0, 18, 0.4);
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(230, 0, 18, 0.3);
    }

    button[hidden] {
      display: none;
    }
  </style>
</head>
<body>
<main>
  <h2 id="title-text">バーコードスキャン</h2>
  <p class="sub-text">赤線にターゲットを合わせてください</p>

  <div id="scanner-wrapper">
    <div id="reader"></div>
    <!-- 上下を黒幕で完全に隠し、中央の高さ30pxの隙間だけを通す -->
    <div class="scan-mask-top"></div>
    <div class="scan-mask-bottom"></div>
    <div class="scan-mask-left"></div>
    <div class="scan-mask-right"></div>
    <div class="scan-laser" id="laser"></div>
  </div>

  <p id="status">カメラを準備しています...</p>
  <button id="retry" hidden>もう一度読み取り直す</button>
</main>

<script>
  // 【重要】ご自身のGASのウェブアプリURLに書き換えてください
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxgT9uUSnl8A59HEtSKCQA9rcMjBGcYxBacY40GB5dC-oI3NzkadnIyhG2YjRFi32WHUQ/exec';

  const urlParams = new URLSearchParams(window.location.search);
  const staff = urlParams.get('staff') || '';
  const eventId = urlParams.get('event') || '';
  const mode = urlParams.get('mode') || 'jan'; // 'jan' または 'imei'

  document.getElementById('title-text').textContent = mode === 'imei' ? '製造番号(IMEI)スキャン' : 'バーコードスキャン';

  let scanner;
  let locked = false;

  async function startScanner() {
    locked = false;
    document.getElementById('retry').hidden = true;
    document.getElementById('status').textContent = 'カメラを起動しています...';
    document.getElementById('laser').style.display = 'block';

    try {
      if (scanner) {
        await scanner.clear();
      }

      const formats = mode === 'imei' ? 
        [Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.EAN_13] : 
        [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8];

      scanner = new Html5Qrcode('reader', {
        formatsToSupport: formats,
        verbose: false
      });

      await scanner.start(
        { facingMode: 'environment' },
        { 
          fps: 20, 
          qrbox: { width: 280, height: 30 } 
        },
        async function(decodedText) {
          if (locked) return;
          locked = true;
          document.getElementById('status').textContent = '読み取りました：' + decodedText;

          try {
            await scanner.stop();
          } catch (e) {}

          const target = new URL(GAS_URL);
          target.searchParams.set('staff', staff);
          target.searchParams.set('event', eventId);
          if (mode === 'imei') {
            target.searchParams.set('imei', decodedText.replace(/[^0-9]/g, '').slice(-6));
          } else {
            target.searchParams.set('jan', decodedText);
          }
          window.location.href = target.toString();
        },
        function() {}
      );

      try {
        await scanner.applyVideoConstraints({
          focusMode: "continuous"
        });
      } catch (err) {}

      document.getElementById('status').textContent = 'カメラにコードを映してください。';
    } catch (error) {
      document.getElementById('status').textContent = 'カメラを起動できません。権限とHTTPSを確認してください。';
      document.getElementById('laser').style.display = 'none';
      document.getElementById('retry').hidden = false;
    }
  }

  document.getElementById('retry').addEventListener('click', startScanner);
  startScanner();
</script>
</body>
</html>
